<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture of the Day</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #f3efe8;
    --accent: #b5502e;
    --dim: rgba(28,26,23,0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
  }
  #img {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #img.loaded { opacity: 1; }
  #caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    color: #fff;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #caption.loaded { opacity: 1; }
  #label {
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.12em;
    font-size: 10px;
    color: rgba(255,255,255,0.75);
  }
  #meta {
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.9);
  }
  #error {
    color: var(--paper);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div id="stage">
    <img id="img" alt="Picture of the day">
    <div id="caption">
      <span id="label">Picture of the day</span>
      <span id="meta"></span>
    </div>
  </div>

<script>
// ---- Config ----
// Path to your JSON file (same repo, relative path works if hosted alongside).
const JSON_URL = "images.json";

// ---- Seeded PRNG (mulberry32) so everyone sees the same "random" order ----
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(array, seed) {
  const rng = mulberry32(seed);
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function daysSinceEpoch(date) {
  return Math.floor(date.getTime() / 86400000);
}

async function init() {
  const imgEl = document.getElementById("img");
  const captionEl = document.getElementById("caption");
  const metaEl = document.getElementById("meta");
  const stage = document.getElementById("stage");

  try {
    const res = await fetch(JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("Could not load " + JSON_URL);
    const data = await res.json();
    const images = data.images || [];
    if (!images.length) throw new Error("No images found in JSON");

    const count = images.length;
    const today = daysSinceEpoch(new Date());
    const cycle = Math.floor(today / count);      // which full pass through the set we're on
    const posInCycle = today % count;              // today's position within that pass
    const order = shuffle(images, cycle + 1);       // reshuffled once per cycle, no repeats within it
    const pick = order[posInCycle];

    imgEl.src = pick.url;
    imgEl.onload = () => {
      imgEl.classList.add("loaded");
      captionEl.classList.add("loaded");
    };
    imgEl.onerror = () => {
      stage.innerHTML = '<div id="error">Image failed to load (id ' + pick.id + ')</div>';
    };

    metaEl.textContent = "#" + pick.id + " · " + (posInCycle + 1) + " / " + count;
  } catch (err) {
    stage.innerHTML = '<div id="error">' + (err.message || "Something went wrong") + '</div>';
  }
}

init();
</script>
</body>
</html>
